<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الأشخاص</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Top navigation, shared across all pages -->
<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">◎</span> نظام الحضور</a>
        <div class="topbar-links">
            <a href="/enroll" class="topbar-link">تسجيل شخص</a>
            <a href="/attendance" class="topbar-link">تسجيل حضور</a>
            <a href="/dashboard" class="topbar-link">التقارير</a>
            <a href="/manage" class="topbar-link active">الإدارة</a>
        </div>
    </div>
</nav>

<div class="page wide">
    <a href="/" class="back-link">→ الرئيسية</a>
    <div class="page-header">
        <h1>إدارة الأشخاص المسجلين</h1>
        <p>عرض وحذف بيانات الأشخاص المسجلين بالنظام</p>
    </div>

    <div class="toolbar">
        <span class="count-pill" id="countMsg">جاري التحميل...</span>
        <a href="/enroll" class="btn small">➕ إضافة شخص جديد</a>
    </div>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>الاسم</th>
                    <th>رقم الجوال</th>
                    <th>تاريخ التسجيل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="5">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadPersons() {
    const response = await fetch('/api/persons');
    const persons = await response.json();

    const tbody = document.getElementById('tableBody');
    document.getElementById('countMsg').textContent = `${persons.length} شخص مسجل`;

    if (persons.length === 0) {
        tbody.innerHTML = "<tr class='empty-row'><td colspan='5'>لا يوجد أشخاص مسجلين بعد</td></tr>";
        return;
    }

    tbody.innerHTML = persons.map((p, i) => {
        const date = new Date(p.created_at).toLocaleDateString('ar-EG');
        return `
            <tr id="row-${p.id}">
                <td class="mono">${i + 1}</td>
                <td>${p.name}</td>
                <td class="mono">${p.phone || '—'}</td>
                <td class="mono">${date}</td>
                <td><button class="btn danger small" onclick="deletePerson(${p.id}, '${p.name}')">🗑️ حذف</button></td>
            </tr>
        `;
    }).join('');
}

// Re-fetches the full list after a successful delete instead of just
// removing the row, so the row numbering (#) stays consistent.
async function deletePerson(id, name) {
    if (!confirm(`هل أنت متأكد من حذف "${name}"؟ هذا الإجراء لا يمكن التراجع عنه.`)) return;

    const response = await fetch(`/api/persons/${id}`, { method: 'DELETE' });
    const result = await response.json();

    if (result.success) {
        document.getElementById(`row-${id}`).remove();
        loadPersons();
    } else {
        alert("⚠️ فشل الحذف: " + result.message);
    }
}

loadPersons();
</script>
</body>
</html>
