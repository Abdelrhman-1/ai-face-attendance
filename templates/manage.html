<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة الطلاب</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">◎</span> نظام الحضور</a>
        <div class="topbar-links">
            <a href="/enroll" class="topbar-link">تسجيل طالب</a>
            <a href="/week" class="topbar-link">الأسبوع</a>
            <a href="/manage" class="topbar-link active">الطلاب</a>
            <a href="/settings" class="topbar-link">الإعدادات</a>
        </div>
    </div>
</nav>

<div class="page wide">
    <a href="/" class="back-link">→ الرئيسية</a>
    <div class="page-header">
        <h1>إدارة الطلاب</h1>
        <p>ابحث بالاسم، رقم الهوية، أو رقم الجوال — يعمل البحث أثناء الكتابة</p>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="input-sm" style="flex:1; max-width: 400px;" placeholder="🔍 ابحث هنا...">
        <a href="/enroll" class="btn small">➕ إضافة طالب</a>
    </div>

    <span class="count-pill" id="countMsg">جاري التحميل...</span>

    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr><th>#</th><th>الاسم</th><th>رقم الهوية</th><th>الجوال</th><th>إجراء</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="5">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const searchInput = document.getElementById('searchInput');
const tableBody = document.getElementById('tableBody');
const countMsg = document.getElementById('countMsg');

async function loadStudents(query = '') {
    const url = query ? `/api/students/search?q=${encodeURIComponent(query)}` : '/api/students/search';
    const response = await fetch(url);
    const students = await response.json();
    renderTable(students);
}

function renderTable(students) {
    countMsg.textContent = `${students.length} طالب`;
    if (students.length === 0) {
        tableBody.innerHTML = "<tr class='empty-row'><td colspan='5'>لا توجد نتائج</td></tr>";
        return;
    }
    tableBody.innerHTML = students.map((s, i) => `
        <tr>
            <td class="mono">${i + 1}</td>
            <td>${s.name}</td>
            <td class="mono">${s.national_id}</td>
            <td class="mono">${s.phone || '—'}</td>
            <td><a href="/manage/${s.id}" class="btn secondary small">فتح الملف</a></td>
        </tr>
    `).join('');
}

// Search runs on every keystroke; SQLite LIKE queries at this scale are
// effectively instant, so no debounce is needed.
searchInput.addEventListener('input', () => loadStudents(searchInput.value.trim()));

loadStudents();
</script>
</body>
</html>
