<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحة الدرس</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">◎</span> نظام الحضور</a>
        <div class="topbar-links">
            <a href="/enroll" class="topbar-link">تسجيل طالب</a>
            <a href="/week" class="topbar-link active">تسجيل الحضور</a>
            <a href="/manage" class="topbar-link">الطلاب</a>
            <a href="/settings" class="topbar-link">الإعدادات</a>
        </div>
    </div>
</nav>

<div class="page wide">
    <a href="/week" class="back-link">→ تسجيل الحضور</a>
    <div class="page-header">
        <h1 id="lessonTitle">صفحة الدرس</h1>
        <p id="lessonDate">...</p>
    </div>

    <!-- Start/close/cancel/reopen controls; shown based on lesson status -->
    <div class="btn-row" id="lessonControls" style="margin-bottom: 20px;"></div>

    <div class="timer-card" id="timerCard">
        <p class="timer-phase" id="timerPhase">...</p>
        <p class="timer-value" id="timerValue">--:--</p>
    </div>



    <!-- Live camera recognition -->
    <div class="card" style="margin-bottom: 20px;">
        <div class="lesson-card-header">
            <h3 style="margin:0;">التعرف اللحظي</h3>
            <div class="tabs" style="margin:0; max-width: 320px;">
                <button class="tab-btn active" id="sourceWebcamBtn">💻 كاميرا اللابتوب</button>
                <button class="tab-btn" id="sourceCctvBtn">📹 كاميرا المراقبة</button>
            </div>
        </div>

        <!-- Webcam mode: browser captures and sends frames to the server -->
        <div id="webcamPanel">
            <div class="scanner">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div class="scanner-corners"><span></span><span></span><span></span><span></span></div>
                <div class="live-badge"><span class="live-dot"></span> مباشر</div>
            </div>
        </div>

        <!-- CCTV mode: server streams the RTSP camera as MJPEG; boxes are
             already drawn server-side, so this is just a plain image. -->
        <div id="cctvPanel" style="display:none;">
            <div class="scanner">
                <img id="cctvImage" src="" alt="بث الكاميرا" style="width:100%; height:100%; object-fit:cover;">
                <div class="live-badge"><span class="live-dot"></span> مباشر</div>
            </div>
            <p class="status" id="cctvStatusMsg" style="margin-top: 10px;"></p>
        </div>

        <div class="readout" id="readout">
            <p class="status-text state-idle">🔍 جاري البحث عن وجه...</p>
        </div>
    </div>

    <!-- Apology, placed right under live recognition -->
    <div class="card" style="margin-bottom: 20px;">
        <h3 style="margin-top:0;">تحديد اعتذار (قبل أو بعد الدرس)</h3>
        <input type="text" id="apologySearch" class="text-input" placeholder="ابحث بالاسم أو رقم الهوية...">
        <div class="search-results" id="apologyResults" style="display:none;"></div>
        <div id="apologySelectedBox" style="display:none; margin-top: 14px;">
            <p class="status" id="apologySelectedText"></p>
            <button id="apologyConfirmBtn" class="btn secondary">✅ تأكيد الاعتذار</button>
        </div>
        <p id="apologyMsg" class="status" style="margin-top: 10px;"></p>
    </div>

    <!-- Manual check-in by search -->
    <div class="card" style="margin-bottom: 20px;">
        <h3 style="margin-top:0;">تسجيل حضور يدوي</h3>
        <input type="text" id="manualSearch" class="text-input" placeholder="ابحث بالاسم أو رقم الهوية أو الجوال...">
        <div class="search-results" id="manualResults" style="display:none;"></div>
    </div>

    <!-- Check-in by national ID -->
    <div class="card">
        <h3 style="margin-top:0;">حضور برقم الهوية</h3>
        <div class="btn-row">
            <input type="text" id="idInput" class="text-input" style="width:auto; flex:1;" placeholder="أدخل رقم الهوية/الوثيقة">
            <button id="idCheckinBtn" class="btn secondary">تسجيل</button>
        </div>
        <p id="idStatusMsg" class="status" style="margin-top:10px;"></p>
    </div>

    <!-- Clicking a card filters the roster panel directly below it -->
    <div class="summary-grid" id="summaryGrid">
        <div class="summary-cell present" data-status="حاضر"><div class="count" id="countPresent">0</div><div class="label">حاضر</div></div>
        <div class="summary-cell late" data-status="متأخر"><div class="count" id="countLate">0</div><div class="label">متأخر</div></div>
        <div class="summary-cell excused" data-status="معتذر"><div class="count" id="countExcused">0</div><div class="label">معتذر</div></div>
        <div class="summary-cell absent" data-status="غائب"><div class="count" id="countAbsent">0</div><div class="label">غائب</div></div>
    </div>

    <!-- Roster, further down the page now -->
    <p class="status" id="rosterFilterHint" style="margin-bottom: 10px;"></p>
    <div class="table-wrap" style="margin-bottom: 28px;">
        <table class="data-table">
            <thead>
                <tr><th>الطالب</th><th>الهوية</th><th>الحالة</th><th>الوقت</th><th>الطريقة</th></tr>
            </thead>
            <tbody id="rosterBody">
                <tr class="empty-row"><td colspan="5">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const lessonId = new URLSearchParams(location.search).get('lesson_id');
if (!lessonId) {
    document.body.innerHTML = '<div class="page center"><p class="status error">⚠️ لم يتم تحديد الدرس. ارجع لصفحة تسجيل الحضور.</p></div>';
    throw new Error("Missing lesson_id");
}

const METHOD_LABELS = { face: 'الوجه', manual: 'يدوي', id: 'الهوية' };
const DAY_LABELS = { sunday: 'درس الأحد', thursday: 'درس الخميس' };
const STATUS_BADGE = {
    'حاضر': 'badge-in', 'متأخر': 'badge-late', 'معتذر': 'badge-excused',
    'غائب': 'badge-absent', 'لم يسجل بعد': 'badge-pending',
};

async function loadLessonInfo() {
    const response = await fetch(`/api/lessons/${lessonId}`);
    const data = await response.json();
    renderLessonInfo(data);
    return data;
}

function renderLessonInfo({ lesson, timing, summary }) {
    document.getElementById('lessonTitle').textContent = DAY_LABELS[lesson.day_type] || 'الدرس';
    document.getElementById('lessonDate').textContent = lesson.lesson_date;

    const controls = document.getElementById('lessonControls');
    if (lesson.status === 'not_started') {
        controls.innerHTML = '<button id="startBtn" class="btn">▶️ بدء الدرس</button>';
        document.getElementById('startBtn').addEventListener('click', startLesson);
    } else if (lesson.status === 'in_progress') {
        controls.innerHTML = `
            <button id="closeBtn" class="btn danger">⏹️ إغلاق الدرس</button>
            <button id="cancelBtn" class="btn secondary">↩️ إلغاء (بدأ بالغلط)</button>
        `;
        document.getElementById('closeBtn').addEventListener('click', closeLesson);
        document.getElementById('cancelBtn').addEventListener('click', cancelLesson);
    } else {
        controls.innerHTML = `
            <span class="badge badge-pending">تم إغلاق هذا الدرس</span>
            <button id="reopenBtn" class="btn secondary small">🔓 إعادة فتح الدرس</button>
        `;
        document.getElementById('reopenBtn').addEventListener('click', reopenLesson);
    }

    const timerCard = document.getElementById('timerCard');
    timerCard.className = 'timer-card phase-' + timing.phase;
    const phaseLabels = {
        not_started: 'لم يبدأ الدرس بعد', on_time: 'فترة الحضور العادي',
        late_period: 'تم بدء احتساب التأخير', closed: 'تم إغلاق الدرس',
    };
    document.getElementById('timerPhase').textContent = phaseLabels[timing.phase] || '';

    if (timing.elapsed_seconds !== null) {
        const m = Math.floor(timing.elapsed_seconds / 60), s = timing.elapsed_seconds % 60;
        document.getElementById('timerValue').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    } else {
        document.getElementById('timerValue').textContent = '--:--';
    }

    document.getElementById('countPresent').textContent = summary['حاضر'] || 0;
    document.getElementById('countLate').textContent = summary['متأخر'] || 0;
    document.getElementById('countExcused').textContent = summary['معتذر'] || 0;
    document.getElementById('countAbsent').textContent = summary['غائب'] || 0;
}

async function startLesson() { await fetch(`/api/lessons/${lessonId}/start`, { method: 'POST' }); loadLessonInfo(); }

async function closeLesson() {
    if (!confirm('هل أنت متأكد من إغلاق الدرس؟ سيتم اعتبار من لم يسجل حضوره غائباً.')) return;
    await fetch(`/api/lessons/${lessonId}/close`, { method: 'POST' });
    loadLessonInfo(); loadRoster();
}

async function cancelLesson() {
    if (!confirm('سيتم إلغاء الدرس وحذف كل الحضور المسجل بهذه الجلسة. متابعة؟')) return;
    await fetch(`/api/lessons/${lessonId}/cancel`, { method: 'POST' });
    loadLessonInfo(); loadRoster();
}

async function reopenLesson() {
    if (!confirm('سيتم إعادة فتح الدرس. سجلات الحضور الحقيقية تبقى محفوظة، ويُحذف فقط الغياب التلقائي.')) return;
    await fetch(`/api/lessons/${lessonId}/reopen`, { method: 'POST' });
    loadLessonInfo(); loadRoster();
}

let lastRoster = [];
let activeStatusFilter = null;

document.querySelectorAll('#summaryGrid .summary-cell').forEach(cell => {
    cell.style.cursor = 'pointer';
    cell.addEventListener('click', () => {
        const status = cell.dataset.status;
        activeStatusFilter = activeStatusFilter === status ? null : status;
        renderRosterTable();
    });
});

function renderRosterTable() {
    const tbody = document.getElementById('rosterBody');
    const hint = document.getElementById('rosterFilterHint');
    const visible = activeStatusFilter ? lastRoster.filter(r => r.status === activeStatusFilter) : lastRoster;

    hint.textContent = activeStatusFilter
        ? `عرض حالة "${activeStatusFilter}" فقط — اضغط على البطاقة مرة أخرى لعرض الجميع`
        : '';

    if (visible.length === 0) {
        tbody.innerHTML = "<tr class='empty-row'><td colspan='5'>لا يوجد طلاب مطابقين</td></tr>";
        return;
    }

    tbody.innerHTML = visible.map(r => `
        <tr>
            <td>${r.name}</td>
            <td class="mono">${r.national_id}</td>
            <td><span class="badge ${STATUS_BADGE[r.status] || 'badge-pending'}">${r.status}</span></td>
            <td class="mono">${r.check_in_time ? new Date(r.check_in_time).toLocaleTimeString('ar-EG') : '—'}</td>
            <td>${METHOD_LABELS[r.method] || '—'}</td>
        </tr>
    `).join('');
}

async function loadRoster() {
    const response = await fetch(`/api/lessons/${lessonId}/roster`);
    lastRoster = await response.json();
    renderRosterTable();
}

let selectedApologyStudent = null;

const apologySearch = document.getElementById('apologySearch');
const apologyResults = document.getElementById('apologyResults');

apologySearch.addEventListener('input', async () => {
    const query = apologySearch.value.trim();
    document.getElementById('apologySelectedBox').style.display = 'none';
    selectedApologyStudent = null;
    if (!query) { apologyResults.style.display = 'none'; return; }

    const response = await fetch(`/api/students/search?q=${encodeURIComponent(query)}`);
    const students = await response.json();

    apologyResults.innerHTML = students.length === 0
        ? '<div class="search-result-item">لا توجد نتائج</div>'
        : students.map(s => `
            <div class="search-result-item" data-id="${s.id}" data-name="${s.name}">
                <span class="sr-name">${s.name}</span><span class="sr-id">${s.national_id}</span>
            </div>
        `).join('');

    apologyResults.querySelectorAll('.search-result-item[data-id]').forEach(item => {
        item.addEventListener('click', () => {
            selectedApologyStudent = { id: parseInt(item.dataset.id), name: item.dataset.name };
            document.getElementById('apologySelectedText').textContent = `الطالب المحدد: ${item.dataset.name}`;
            document.getElementById('apologySelectedBox').style.display = 'block';
            apologyResults.style.display = 'none';
        });
    });
    apologyResults.style.display = 'block';
});

document.getElementById('apologyConfirmBtn').addEventListener('click', async () => {
    if (!selectedApologyStudent) return;
    const msg = document.getElementById('apologyMsg');

    const response = await fetch(`/api/lessons/${lessonId}/apology`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: selectedApologyStudent.id })
    });
    const result = await response.json();
    msg.textContent = result.success
        ? `✅ تم تسجيل اعتذار ${selectedApologyStudent.name}`
        : `⚠️ ${result.message}`;
    msg.className = 'status ' + (result.success ? 'success' : 'error');

    if (result.success) {
        apologySearch.value = '';
        document.getElementById('apologySelectedBox').style.display = 'none';
        selectedApologyStudent = null;
        loadRoster(); loadLessonInfo();
    }
});

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const captureCanvas = document.getElementById('captureCanvas');
const readout = document.getElementById('readout');

navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } })
    .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => { overlay.width = video.clientWidth; overlay.height = video.clientHeight; };
    })
    .catch(() => { readout.innerHTML = '<p class="status-text state-error">⚠️ لم يتم السماح بالوصول للكاميرا</p>'; });

const STATUS_COLOR = { 'حاضر': '#33D69F', 'متأخر': '#FFB84D' };
const STATUS_STATE = { 'حاضر': 'state-in', 'متأخر': 'state-unknown' };

function drawFaceBoxes(faces, frameSize) {
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    if (!frameSize) return;
    const scaleX = overlay.width / frameSize.width, scaleY = overlay.height / frameSize.height;
    faces.forEach(face => {
        const { box, label, known, status } = face;
        const left = box.left * scaleX, top = box.top * scaleY;
        const width = (box.right - box.left) * scaleX, height = (box.bottom - box.top) * scaleY;
        const color = known ? (STATUS_COLOR[status] || '#5B8CFF') : '#FF6B6B';
        ctx.strokeStyle = color; ctx.lineWidth = 3;
        ctx.strokeRect(left, top, width, height);
        ctx.fillStyle = color; ctx.font = "700 16px Tajawal, sans-serif";
        ctx.fillText(label, left, top - 10);
    });
}

function renderReadout(faces) {
    const now = new Date().toLocaleTimeString('ar-EG');
    if (faces.length === 0) {
        readout.innerHTML = `<p class="status-text state-idle">🔍 جاري البحث عن وجه... <span class="status-meta">${now}</span></p>`;
        return;
    }
    readout.innerHTML = faces.map(f => {
        const stateClass = f.known ? (STATUS_STATE[f.status] || 'state-idle') : 'state-unknown';
        return `<p class="status-text ${stateClass}">${f.message} <span class="status-meta">${now}</span></p>`;
    }).join('');
}

async function captureAndRecognize() {
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;
    captureCanvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = captureCanvas.toDataURL('image/jpeg', 0.6);

    try {
        const response = await fetch(`/api/lessons/${lessonId}/recognize_live`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageData })
        });
        const result = await response.json();
        drawFaceBoxes(result.faces || [], result.frame_size);
        renderReadout(result.faces || []);
    } catch (e) {
        readout.innerHTML = '<p class="status-text state-error">⚠️ خطأ في الاتصال بالسيرفر</p>';
    }
}

async function recognitionLoop() {
    if (currentSource !== 'webcam') return; // stop the client-side loop while CCTV mode is active
    await captureAndRecognize();
    setTimeout(recognitionLoop, 30);
}

// --- Source switching (laptop webcam vs. CCTV/RTSP camera) ---

let currentSource = 'webcam';

const sourceWebcamBtn = document.getElementById('sourceWebcamBtn');
const sourceCctvBtn = document.getElementById('sourceCctvBtn');
const webcamPanel = document.getElementById('webcamPanel');
const cctvPanel = document.getElementById('cctvPanel');
const cctvImage = document.getElementById('cctvImage');
const cctvStatusMsg = document.getElementById('cctvStatusMsg');

async function switchToWebcam() {
    currentSource = 'webcam';
    sourceWebcamBtn.classList.add('active');
    sourceCctvBtn.classList.remove('active');
    webcamPanel.style.display = 'block';
    cctvPanel.style.display = 'none';
    cctvImage.src = '';
    await fetch('/api/camera/stream/stop', { method: 'POST' });
    recognitionLoop();
}

async function switchToCctv() {
    currentSource = 'cctv';
    sourceCctvBtn.classList.add('active');
    sourceWebcamBtn.classList.remove('active');
    webcamPanel.style.display = 'none';
    cctvPanel.style.display = 'block';

    await fetch(`/api/camera/stream/start/${lessonId}`, { method: 'POST' });
    // Cache-busting query string forces the browser to open a fresh MJPEG
    // connection rather than reusing a stalled one from a previous switch.
    cctvImage.src = `/video_feed?t=${Date.now()}`;

    setTimeout(checkCctvStatus, 1500);
}

async function checkCctvStatus() {
    if (currentSource !== 'cctv') return;
    const response = await fetch('/api/camera/stream/status');
    const status = await response.json();
    cctvStatusMsg.textContent = status.error
        ? `⚠️ ${status.error}`
        : (status.running ? '✅ البث يعمل' : '⏳ جاري الاتصال...');
    cctvStatusMsg.className = 'status ' + (status.error ? 'error' : 'success');
}

sourceWebcamBtn.addEventListener('click', switchToWebcam);
sourceCctvBtn.addEventListener('click', switchToCctv);
setInterval(() => { if (currentSource === 'cctv') checkCctvStatus(); }, 3000);

const manualSearch = document.getElementById('manualSearch');
const manualResults = document.getElementById('manualResults');

manualSearch.addEventListener('input', async () => {
    const query = manualSearch.value.trim();
    if (!query) { manualResults.style.display = 'none'; return; }

    const response = await fetch(`/api/students/search?q=${encodeURIComponent(query)}`);
    const students = await response.json();

    manualResults.innerHTML = students.length === 0
        ? '<div class="search-result-item">لا توجد نتائج</div>'
        : students.map(s => `
            <div class="search-result-item" data-id="${s.id}">
                <span class="sr-name">${s.name}</span><span class="sr-id">${s.national_id}</span>
            </div>
        `).join('');
    manualResults.querySelectorAll('.search-result-item[data-id]').forEach(item => {
        item.addEventListener('click', () => checkInManually(item.dataset.id));
    });
    manualResults.style.display = 'block';
});

async function checkInManually(studentId) {
    const response = await fetch(`/api/lessons/${lessonId}/checkin`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id: parseInt(studentId), method: 'manual' })
    });
    const result = await response.json();
    alert(result.message);
    manualSearch.value = '';
    manualResults.style.display = 'none';
    loadRoster(); loadLessonInfo();
}

document.getElementById('idCheckinBtn').addEventListener('click', async () => {
    const nationalId = document.getElementById('idInput').value.trim();
    const msg = document.getElementById('idStatusMsg');
    if (!nationalId) return;

    const response = await fetch(`/api/lessons/${lessonId}/checkin_by_national_id`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ national_id: nationalId })
    });
    const result = await response.json();
    msg.textContent = result.message;
    msg.className = 'status ' + (result.success ? 'success' : 'error');
    if (result.success) {
        document.getElementById('idInput').value = '';
        loadRoster(); loadLessonInfo();
    }
});

setInterval(loadLessonInfo, 3000);
setInterval(loadRoster, 4000);

loadLessonInfo();
loadRoster();
recognitionLoop();
</script>
</body>
</html>
