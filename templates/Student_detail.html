<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملف الطالب</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">◎</span> نظام الحضور</a>
        <div class="topbar-links">
            <a href="/enroll" class="topbar-link">تسجيل طالب</a>
            <a href="/week" class="topbar-link">الأسبوع</a>
            <a href="/manage" class="topbar-link active">الطلاب</a>
            <a href="/settings" class="topbar-link">الإعدادات</a>
        </div>
    </div>
</nav>

<div class="page wide">
    <a href="/manage" class="back-link">→ إدارة الطلاب</a>
    <div class="page-header"><h1 id="pageTitle">ملف الطالب</h1></div>

    <div class="card" style="margin-bottom: 24px;">
        <div class="field">
            <label>الاسم الكامل</label>
            <input type="text" id="nameInput">
        </div>
        <div class="field">
            <label>رقم الهوية / الوثيقة</label>
            <input type="text" id="nationalIdInput">
        </div>
        <div class="field">
            <label>رقم الجوال</label>
            <input type="tel" id="phoneInput">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="camera">📷 تصوير مباشر (اختياري)</button>
            <button class="tab-btn" data-tab="upload">⬆️ رفع صورة (اختياري)</button>
        </div>
        <div class="tab-panel active" id="panel-camera">
            <div class="scanner">
                <video id="video" autoplay playsinline muted></video>
                <div class="scanner-corners"><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="btn-row" style="margin-top:16px;">
                <button id="snapBtn" class="btn secondary">📸 التقط صورة جديدة</button>
            </div>
        </div>
        <div class="tab-panel" id="panel-upload">
            <div class="upload-zone" id="uploadZone">
                <span class="icon">🖼️</span>
                اضغط هنا لاختيار صورة جديدة
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </div>
        </div>
        <div class="preview-wrap" id="previewWrap">
            <img id="previewImg" alt="معاينة الصورة الجديدة">
        </div>
        <p class="status" style="text-align:right; color: var(--text-faint); font-size: 13px;">
            اترك التصوير فارغاً إذا لا تريد تغيير صورة الوجه الحالية
        </p>

        <div class="btn-row" style="margin-top: 20px;">
            <button id="saveBtn" class="btn">💾 حفظ التعديلات</button>
            <button id="deleteBtn" class="btn danger">🗑️ حذف الطالب</button>
        </div>
        <p id="statusMsg" class="status" style="margin-top: 12px;"></p>
    </div>

    <h3>سجل الحضور</h3>
    <div class="table-wrap">
        <table class="data-table">
            <thead>
                <tr><th>الأسبوع</th><th>اليوم</th><th>الحالة</th><th>الوقت</th><th>الطريقة</th></tr>
            </thead>
            <tbody id="historyBody">
                <tr class="empty-row"><td colspan="5">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const studentId = {{ student_id }};
const DAY_LABELS = { sunday: 'الأحد', thursday: 'الخميس' };
const METHOD_LABELS = { face: 'الوجه', manual: 'يدوي', id: 'الهوية' };
const STATUS_BADGE = {
    'حاضر': 'badge-in', 'متأخر': 'badge-late', 'معتذر': 'badge-excused', 'غائب': 'badge-absent',
};

let currentImageDataUrl = null;

async function loadStudent() {
    const response = await fetch(`/api/students/${studentId}`);
    const data = await response.json();
    if (!data.success) { alert('الطالب غير موجود'); location.href = '/manage'; return; }

    document.getElementById('pageTitle').textContent = data.student.name;
    document.getElementById('nameInput').value = data.student.name;
    document.getElementById('nationalIdInput').value = data.student.national_id;
    document.getElementById('phoneInput').value = data.student.phone || '';

    const historyBody = document.getElementById('historyBody');
    if (data.history.length === 0) {
        historyBody.innerHTML = "<tr class='empty-row'><td colspan='5'>لا يوجد سجل حضور بعد</td></tr>";
    } else {
        historyBody.innerHTML = data.history.map(h => `
            <tr>
                <td class="mono">${h.week_start}</td>
                <td>${DAY_LABELS[h.day_type]}</td>
                <td><span class="badge ${STATUS_BADGE[h.status] || 'badge-pending'}">${h.status}</span></td>
                <td class="mono">${h.check_in_time ? new Date(h.check_in_time).toLocaleTimeString('ar-EG') : '—'}</td>
                <td>${METHOD_LABELS[h.method] || '—'}</td>
            </tr>
        `).join('');
    }
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
});

const video = document.getElementById('video');
navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; })
    .catch(() => {});

function setPreview(dataUrl) {
    currentImageDataUrl = dataUrl;
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('previewWrap').style.display = 'block';
}

document.getElementById('snapBtn').addEventListener('click', () => {
    const canvas = document.getElementById('captureCanvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    setPreview(canvas.toDataURL('image/jpeg', 0.9));
});

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => setPreview(e.target.result);
    reader.readAsDataURL(file);
});

document.getElementById('saveBtn').addEventListener('click', async () => {
    const statusMsg = document.getElementById('statusMsg');
    const payload = {
        name: document.getElementById('nameInput').value.trim(),
        national_id: document.getElementById('nationalIdInput').value.trim(),
        phone: document.getElementById('phoneInput').value.trim(),
    };
    if (currentImageDataUrl) payload.image = currentImageDataUrl;

    const response = await fetch(`/api/students/${studentId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });
    const result = await response.json();
    statusMsg.textContent = result.message;
    statusMsg.className = 'status ' + (result.success ? 'success' : 'error');
    if (result.success) loadStudent();
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!confirm('هل أنت متأكد من حذف هذا الطالب؟ سيُحذف سجل حضوره بالكامل.')) return;
    await fetch(`/api/students/${studentId}`, { method: 'DELETE' });
    location.href = '/manage';
});

loadStudent();
</script>
</body>
</html>
