<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل طالب جديد</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">◎</span> نظام الحضور</a>
        <div class="topbar-links">
            <a href="/enroll" class="topbar-link active">تسجيل طالب</a>
            <a href="/week" class="topbar-link">الأسبوع</a>
            <a href="/manage" class="topbar-link">الطلاب</a>
            <a href="/settings" class="topbar-link">الإعدادات</a>
        </div>
    </div>
</nav>

<div class="page">
    <a href="/" class="back-link">→ الرئيسية</a>
    <div class="page-header">
        <h1>تسجيل طالب جديد</h1>
        <p>رقم الهوية/الوثيقة هو المعرّف الأساسي، ولا يمكن تكراره</p>
    </div>

    <div class="card">
        <div class="field">
            <label>الاسم الكامل</label>
            <input type="text" id="nameInput" placeholder="مثال: أحمد محمد">
        </div>
        <div class="field">
            <label>رقم الهوية / الوثيقة *</label>
            <input type="text" id="nationalIdInput" placeholder="هوية، جواز سفر، إقامة...">
        </div>
        <div class="field">
            <label>رقم الجوال (اختياري)</label>
            <input type="tel" id="phoneInput" placeholder="05xxxxxxxx">
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="camera">📷 تصوير مباشر</button>
            <button class="tab-btn" data-tab="upload">⬆️ رفع صورة</button>
        </div>

        <div class="tab-panel active" id="panel-camera">
            <div class="scanner">
                <video id="video" autoplay playsinline muted></video>
                <div class="scanner-corners"><span></span><span></span><span></span><span></span></div>
            </div>
            <div class="btn-row" style="margin-top:16px;">
                <button id="snapBtn" class="btn secondary">📸 التقط الصورة</button>
            </div>
        </div>

        <div class="tab-panel" id="panel-upload">
            <div class="upload-zone" id="uploadZone">
                <span class="icon">🖼️</span>
                اضغط هنا لاختيار صورة من جهازك
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </div>
        </div>

        <div class="preview-wrap" id="previewWrap">
            <img id="previewImg" alt="معاينة الصورة">
        </div>

        <div class="btn-row" style="margin-top:24px;">
            <button id="submitBtn" class="btn full" disabled>✅ تسجيل الطالب</button>
        </div>

        <p id="statusMsg" class="status" style="margin-top:14px;"></p>
    </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const captureCanvas = document.getElementById('captureCanvas');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');

let currentImageDataUrl = null;

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
});

navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => { video.srcObject = stream; })
    .catch(() => { statusMsg.textContent = "⚠️ لم يتم السماح بالوصول للكاميرا"; statusMsg.className = "status error"; });

function setPreview(dataUrl) {
    currentImageDataUrl = dataUrl;
    previewImg.src = dataUrl;
    previewWrap.style.display = 'block';
    submitBtn.disabled = false;
    statusMsg.textContent = "";
}

document.getElementById('snapBtn').addEventListener('click', () => {
    captureCanvas.width = video.videoWidth;
    captureCanvas.height = video.videoHeight;
    captureCanvas.getContext('2d').drawImage(video, 0, 0);
    setPreview(captureCanvas.toDataURL('image/jpeg', 0.9));
});

const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
uploadZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => setPreview(e.target.result);
    reader.readAsDataURL(file);
});

submitBtn.addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    const nationalId = document.getElementById('nationalIdInput').value.trim();
    const phone = document.getElementById('phoneInput').value.trim();

    if (!name) {
        statusMsg.textContent = "⚠️ الرجاء إدخال الاسم أولاً";
        statusMsg.className = "status error";
        return;
    }
    if (!nationalId) {
        statusMsg.textContent = "⚠️ الرجاء إدخال رقم الهوية/الوثيقة";
        statusMsg.className = "status error";
        return;
    }
    if (!currentImageDataUrl) {
        statusMsg.textContent = "⚠️ الرجاء التقاط أو رفع صورة أولاً";
        statusMsg.className = "status error";
        return;
    }

    submitBtn.disabled = true;
    statusMsg.textContent = "⏳ جاري المعالجة...";
    statusMsg.className = "status";

    try {
        const response = await fetch('/api/enroll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, national_id: nationalId, phone, image: currentImageDataUrl })
        });
        const result = await response.json();
        statusMsg.textContent = result.message;
        statusMsg.className = "status " + (result.success ? "success" : "error");
        submitBtn.disabled = false;

        if (result.success) {
            document.getElementById('nameInput').value = "";
            document.getElementById('nationalIdInput').value = "";
            document.getElementById('phoneInput').value = "";
            previewWrap.style.display = 'none';
            currentImageDataUrl = null;
            submitBtn.disabled = true;
        }
    } catch (e) {
        statusMsg.textContent = "⚠️ خطأ في الاتصال بالسيرفر";
        statusMsg.className = "status error";
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
